<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO Application</title>
    <style>
      /* General Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Arial", sans-serif;
        background-color: #121212;
        color: #ffffff;
        margin: 0;
        padding: 20px;
        text-align: center;
      }

      h1 {
        color: #ffffff;
        font-size: 2.5rem;
        margin-bottom: 20px;
      }

      input[type="text"] {
        padding: 12px 15px;
        width: 60%;
        margin-right: 10px;
        border: none;
        border-radius: 10px;
        outline: none;
        font-size: 16px;
        background-color: #1f1f1f;
        color: #ffffff;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        transition: box-shadow 0.3s;
      }

      input[type="text"]:focus {
        box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.7);
      }

      input[type="text"]::placeholder {
        color: #888888;
      }

      button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background-color: #bb86fc;
        color: #121212;
        box-shadow: 0 4px 6px rgba(187, 134, 252, 0.4);
        transition: background-color 0.3s, box-shadow 0.3s;
      }

      button:hover {
        background-color: #9b68db;
        box-shadow: 0 6px 8px rgba(155, 104, 219, 0.6);
      }

      #todos {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        justify-items: center;
      }

      .todo-item {
        background-color: #1f1f1f;
        padding: 20px;
        border-radius: 15px;
        width: 90%;
        max-width: 300px;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
        text-align: left;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.3s, box-shadow 0.3s;
      }

      .todo-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.7);
      }

      .todo-item h2 {
        font-size: 18px;
        margin-bottom: 10px;
        word-break: break-word;
        color: #ffffff;
      }

      .todo-item h2.completed {
        text-decoration: line-through;
        color: #666666;
      }

      .todo-item button {
        margin-top: 10px;
        padding: 8px 15px;
        font-size: 14px;
        border: none;
        border-radius: 8px;
        background-color: #ff5252;
        color: #ffffff;
        cursor: pointer;
        transition: background-color 0.3s, box-shadow 0.3s;
        box-shadow: 0 4px 6px rgba(255, 82, 82, 0.4);
      }

      .todo-item button:hover {
        background-color: #d43c3c;
        box-shadow: 0 6px 10px rgba(212, 60, 60, 0.6);
      }
    </style>
  </head>
  <body>
    <h1>TODO Application</h1>
    <div>
      <input
        type="text"
        id="todo-input"
        placeholder="What do you need to do?"
      />
      <button onclick="addTodo()">Add</button>
    </div>
    <div id="todos"></div>

    <script src="script.js"></script>
  </body>
</html>
